<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: rgb(152, 25, 25);
        }

        header{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 100px;
            margin: 15px;
            background-color: black;
        }

        header h1{
            color: white;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        div{
            background-color: rgb(255, 217, 168);
            border: 1px;
            border-style: solid;
            border-radius: 5px;
            border-color: black;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Rate a Movie</h1>
    </header>

    <p style="text-align: center;">Share your top pick and write a review.</p>

    <div class="thing" style="width: 500px; align-items: center;">
        
        <img src="Screenshot 2026-09-18 at 6.24.16 AM.png" alt="Movie icon" width="100"> <br>
        <form action="">
            <input type="text" id="mtitle" name="mtitle" placeholder="Movie Title" style="width: 400px; height: 50px; border-radius: 7px; border: 1px solid; text-align: center;">
            <br> <br>
            <label for="genres"><strong>Genres</strong> (select all that apply)</label> <br>
            <input type="checkbox" id="action">
            <label for="action"> Action</label><br>
            <input type="checkbox" id="Drama">
            <label for="Drama">Drama</label><br>
            <input type="checkbox" id="Comedy">
            <label for="Comedy">Comedy</label><br>
            <input type="checkbox" id="fantasy">
            <label for="fantasy">Fantasy</label><br>
            <input type="checkbox" id="scifi">
            <label for="scifi">Sci-Fi</label><br><br>

            <label for="ratings"><strong>Rating:</strong></label> <br>
            <input type="radio" id="1" name="rating">
            <label for="1">⭐</label><br>
            <input type="radio" id="2" name="rating">
            <label for="2">⭐⭐</label><br>
            <input type="radio" id="3" name="rating">
            <label for="3">⭐⭐⭐</label><br>
            <input type="radio" id="4" name="rating">
            <label for="4">⭐⭐⭐⭐</label><br>
            <input type="radio" id="5" name="rating">
            <label for="5">⭐⭐⭐⭐⭐</label><br><br>

            <input type="text" placeholder="Write your review..." style="width: 400px; height: 50px; border-radius: 7px; border: 1px solid; text-align: center; margin-bottom: 2px;"><br>

            <input type="submit" value="Submit Review" style="width: 100%; height: 40px; border-radius: 7px; border: 1px solid; text-align: center; margin-top: 2px;">
            <p>Movie review tips: <a href="">Click here</a></p> <br>
        </form>

    </div>
    <br>
    <footer style="text-align: center;">© 2026 | Yael Janaya V. Reyes | 9-Topaz | Q1 DRILL 2</footer>
</body>
</html>
